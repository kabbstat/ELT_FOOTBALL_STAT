version: 2

models:
  - name: mart_team_stats
    description: "Comprehensive team statistics aggregated by competition"
    columns:
      - name: team_id
        description: "Unique team identifier"
        data_tests:
          - not_null
      
      - name: team_name
        description: "Team name"
        data_tests:
          - not_null
      
      - name: league_code
        description: "Competition code (PL, FL1, PD)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PL', 'FL1', 'PD']
      
      - name: total_matches
        description: "Total matches played"
        data_tests:
          - not_null
      
      - name: total_points
        description: "Total points (3 for win, 1 for draw)"
        data_tests:
          - not_null
      
      - name: win_rate
        description: "Percentage of matches won"

  - name: mart_league_standings
    description: "Current league standings with ranking"
    columns:
      - name: league_code
        description: "Competition code"
        data_tests:
          - not_null
      
      - name: team_rank
        description: "Current position in the league"
        data_tests:
          - not_null
      
      - name: team_name
        description: "Team name"
        data_tests:
          - not_null

  - name: mart_match_overview
    description: "High-level match statistics and trends"
    columns:
      - name: league_code
        description: "Competition code"
      
      - name: total_matches
        description: "Total matches in the league"
      
      - name: avg_goals_per_match
        description: "Average goals per match"

  - name: mart_team_form
    description: "Team form based on last 5 matches"
    columns:
      - name: team_id
        description: "Team identifier"
      
      - name: team_name
        description: "Team name"
      
      - name: last_5_points
        description: "Points from last 5 matches"
      
      - name: current_form
        description: "Form indicator (W/D/L sequence)"

  - name: fact_matches_enriched
    description: "Matches enriched with team market values for analytics"
    columns:
      - name: match_id
        description: "Unique match identifier"
        data_tests:
          - unique
          - not_null
      - name: home_team_market_value
        description: "Home team market value in EUR"
      - name: away_team_market_value
        description: "Away team market value in EUR"
      - name: value_difference
        description: "Difference in market value (home - away)"
      - name: is_upset
        description: "True if lower-value team won"
      - name: favorite_by_value
        description: "Which team was favorite based on market value"
      - name: richer_team_won
        description: "True if the team with higher market value won"

  - name: agg_value_performance
    description: "Analytics: Market value correlation with match outcomes"
    columns:
      - name: analysis_type
        description: "Type of analysis (competition_analysis, value_tier_matchup)"
      - name: competition_code
        description: "Competition code"
      - name: upset_rate_percent
        description: "Percentage of upsets (lower value team winning)"
      - name: richer_team_win_rate
        description: "Win rate of richer team in non-draw matches"
      - name: avg_goals
        description: "Average goals per match"

  - name: fact_matches_full
    description: "Fully enriched fact table joining matches + team values + weather. Central analytical model."
    columns:
      - name: match_id
        description: "Unique match identifier"
        data_tests:
          - unique
          - not_null
      - name: weather_impact_score
        description: "Composite weather impact score (0=ideal, higher=worse conditions)"
      - name: is_upset
        description: "True if match was an upset (lower-value team won)"
      - name: combined_market_value
        description: "Sum of home + away team market values"
      - name: weather_condition
        description: "Weather at match location (Clear, Rain, Clouds, etc.)"

  - name: mart_weather_impact
    description: "Analysis of weather conditions impact on match outcomes and scoring"
    columns:
      - name: analysis_type
        description: "Type: by_condition, by_temperature, or adverse_vs_favorable"
      - name: category
        description: "Weather condition or temperature range"
      - name: avg_goals
        description: "Average goals per match in this category"
      - name: home_win_rate_pct
        description: "Home win rate percentage"

  - name: mart_value_roi
    description: "ROI analysis: performance per euro of market value, with bargain/overspend classification"
    columns:
      - name: team_name
        description: "Team name"
        data_tests:
          - not_null
      - name: points_per_million_eur
        description: "Points earned per million EUR of market value"
      - name: roi_classification
        description: "Bargain, overperformer, on track, underperformer, or overspend"
      - name: efficiency_rank
        description: "Rank of efficiency within the league"
      - name: rank_difference
        description: "Expected rank minus actual rank (positive = overperforming)"

  - name: mart_prediction_features
    description: "ML-ready feature table with 6 feature categories for match outcome prediction"
    columns:
      - name: match_id
        description: "Unique match identifier"
        data_tests:
          - unique
          - not_null
      - name: match_result_encoded
        description: "Target variable: 1=home win, 0=draw, -1=away win"
      - name: value_advantage_pct
        description: "Home team value advantage as percentage [-1, 1]"
      - name: home_form_points
        description: "Home team points from last 5 matches"
      - name: away_form_points
        description: "Away team points from last 5 matches"
      - name: home_advantage_score
        description: "Composite home advantage score"